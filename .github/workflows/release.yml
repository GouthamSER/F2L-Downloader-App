name: Release APK
on:
  push:
    tags: [ 'v*' ]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/f2l.jks"
      - name: Build signed release APK
        env:
          F2L_KEYSTORE_FILE: ${{ runner.temp }}/f2l.jks
          F2L_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          F2L_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          F2L_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: Name the APK
        run: mv app/build/outputs/apk/release/app-release.apk "F2L-Downloader-${GITHUB_REF_NAME}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: F2L-Downloader-*.apk
          generate_release_notes: true
